name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/build-betterdiscord.mjs
      - run: npm test
      - run: node scripts/setup.mjs
      - run: node scripts/inject.mjs --download-only
      - uses: actions/upload-artifact@v4
        with:
          name: betterdiscord-plugins-${{ matrix.os }}
          path: dist/betterdiscord/*.plugin.js
